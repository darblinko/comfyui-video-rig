[project]
name = "comfyui-video-rig"
version = "0.1.0"
description = "Single-GPU EC2 rig and ComfyUI job runner for image-to-video model comparisons, with idle auto-stop and SSM-only access"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nysara Global LLC" }]
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Systems Administration",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = [".", "runner"]
testpaths = ["tests"]
