[project]
name = "comfyui-video-rig"
version = "0.1.0"
description = "Single-GPU EC2 rig and ComfyUI job runner for image-to-video model comparisons, with idle auto-stop and SSM-only access"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nysara Global LLC" }]
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Systems Administration",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# The scripts import each other by module name (runner/ is on sys.path), so
# list them as first-party for a stable import order.
known-first-party = [
    "comfy_client", "conftest", "dry_run", "launch_rig", "media", "postprocess", "rig_config", "run_chain",
    "run_job", "s3_sync", "summarize",
]

[tool.pytest.ini_options]
pythonpath = [".", "runner", "chain", "results"]
testpaths = ["tests"]
