name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - name: bash syntax
        run: for script in bootstrap/*.sh; do bash -n "$script"; done

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: ffmpeg for tests/test_media_ffmpeg.py
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install "boto3>=1.34" "pytest>=8"
      - run: python -m pytest -q
      - name: dry runs (no credentials, no network)
        run: |
          python launch_rig.py --dry-run launch
          python runner/run_job.py jobs/examples/shaker_demo.toml --dry-run
